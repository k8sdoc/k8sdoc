{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8sdoc.fullname" . }}
  labels:
    {{- include "k8sdoc.labels" . | nindent 4 }}
rules:
  # Standard Kubernetes resources
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - configmaps
      - events
      - namespaces
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - daemonsets
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
    verbs: ["get", "list", "watch"]

  # kdoctor CRDs (kdoctor.io group)
  - apiGroups: ["kdoctor.io"]
    resources:
      - netreaches
      - apphttphealthies
      - netdnses
    verbs: ["get", "list", "watch"]

  # kdoctor system reports (system.kdoctor.io group)
  - apiGroups: ["system.kdoctor.io"]
    resources:
      - kdoctorreports
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k8sdoc.fullname" . }}
  labels:
    {{- include "k8sdoc.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "k8sdoc.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "k8sdoc.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
