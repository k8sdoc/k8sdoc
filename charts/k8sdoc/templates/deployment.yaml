apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8sdoc.fullname" . }}
  labels:
    {{- include "k8sdoc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "k8sdoc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "k8sdoc.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "k8sdoc.serviceAccountName" . }}
      containers:
        - name: k8sdoc
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --port={{ .Values.k8sdoc.serve.port }}
          env:
            - name: OLLAMA_BASE_URL
              value: {{ include "k8sdoc.ollamaURL" . }}
          ports:
            - containerPort: {{ .Values.k8sdoc.serve.port }}
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

---
{{- if .Values.ollama.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8sdoc.fullname" . }}-ollama
  labels:
    {{- include "k8sdoc.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "k8sdoc.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ollama
  template:
    metadata:
      labels:
        {{- include "k8sdoc.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ollama
    spec:
      {{- if .Values.ollama.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.ollama.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.ollama.tolerations }}
      tolerations:
        {{- toYaml .Values.ollama.tolerations | nindent 8 }}
      {{- end }}
      initContainers:
        # Pull the model on first start
        - name: pull-model
          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          command: ["/bin/sh", "-c"]
          args:
            - |
              ollama serve &
              sleep 5
              ollama pull {{ .Values.ollama.model }}
              wait
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
      containers:
        - name: ollama
          image: "{{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}"
          ports:
            - containerPort: 11434
              name: ollama
          env:
            - name: OLLAMA_CUDA
              value: "1"
            - name: OLLAMA_NUM_PARALLEL
              value: "2"
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: ollama-data
          {{- if .Values.ollama.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "k8sdoc.fullname" . }}-ollama
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8sdoc.fullname" . }}-ollama
  labels:
    {{- include "k8sdoc.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "k8sdoc.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
  ports:
    - port: 11434
      targetPort: 11434
      name: ollama
{{- end }}
